name: Build tip site

on:
  schedule:
    - cron: "30 14 * * *"   # after the morning Instagram post
  workflow_dispatch:
  push:
    paths: ["build.py", "pinterest-verify.txt"]

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Build pages, pins and feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build.py
      - name: Save
        run: |
          git config user.name "tessa-bot"
          git config user.email "tessa-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update tip site"
          git push
